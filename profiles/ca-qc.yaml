# SPDX-License-Identifier: Community-Spec-1.0
# Jurisdiction profile of the FPSOT decisions specification (DEC-011, DEC-012), in the form
# of the class Profile of model/decisions.yaml. Released apart from the core rules.
# Québec public bodies. Article 65.2 of the Access Act, as government guidance describes it,
# and article 8 of the Act respecting administrative justice. The wording of both articles
# was not read at the source and is to be verified. Québec law sets no impact levels, so the
# controls are the same at every level. Not legal advice.
code: ca-qc
version: 0.1.0
title: {en: Québec profile, fr: Profil du Québec}
impactAssessmentKinds: [privacy-impact-assessment]
levels:
  - {level: level-1, humanReview: false, dualReview: false, automationNotice: required-when-fully-automated, recourseNotice: required, allReasons: false}
  - {level: level-2, humanReview: false, dualReview: false, automationNotice: required-when-fully-automated, recourseNotice: required, allReasons: false}
  - {level: level-3, humanReview: false, dualReview: false, automationNotice: required-when-fully-automated, recourseNotice: required, allReasons: false}
  - {level: level-4, humanReview: false, dualReview: false, automationNotice: required-when-fully-automated, recourseNotice: required, allReasons: false}
